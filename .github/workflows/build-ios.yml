name: Build iOS app
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check archive format and build unsigned IPA
        run: bash build-unsigned.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ChatCapture-unsigned
          path: build/ChatCapture-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
